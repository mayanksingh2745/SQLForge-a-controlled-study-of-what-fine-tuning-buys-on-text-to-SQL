name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test & Lint (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Upgrade pip and install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install SQLForge with dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff Format Check
        run: |
          ruff format --check .

      - name: Run Ruff Linting
        run: |
          ruff check .

      - name: Run MyPy Type Checking
        run: |
          mypy src/sqlforge

      - name: Run Pytest Suite
        run: |
          pytest -v tests/

      - name: Test CLI entrypoint
        run: |
          sqlforge --version
          sqlforge --help
          sqlforge env
          sqlforge config validate
